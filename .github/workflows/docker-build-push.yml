---
name: Docker build and push

'on':
  push:
    branches:
      - 'master'
  schedule:
    # Upstream's ES_VER pin is read at run time, so a weekly run publishes a
    # new image when upstream bumps Elasticsearch, without a commit here.
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Resolve upstream Elasticsearch version
        id: upstream
        uses: ./.github/actions/upstream-es-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          load: true
          tags: quay.io/honeynet/filebeat:${{ steps.upstream.outputs.version }}
          build-args: |
            filebeat_version=${{ steps.upstream.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built and tested before pushing, so a broken image is never published.
      - name: Smoke test the image
        env:
          IMAGE: quay.io/honeynet/filebeat:${{ steps.upstream.outputs.version }}
          EXPECTED: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          reported="$(docker run --rm "$IMAGE" version)"
          echo "$reported"

          if ! printf '%s' "$reported" | grep -q "$EXPECTED"; then
            echo "::error::Image reports '$reported', expected version $EXPECTED"
            exit 1
          fi

          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test "$(id -u)" = 2000
            test -d /usr/share/filebeat/conf.d
            test -d /usr/share/filebeat/pki
            touch /usr/share/filebeat/conf.d/.probe
            touch /usr/share/filebeat/pki/.probe
          '
          echo "Image runs as uid 2000 with writable conf.d and pki."

      - name: Push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: quay.io/honeynet/filebeat:${{ steps.upstream.outputs.version }}
          build-args: |
            filebeat_version=${{ steps.upstream.outputs.version }}
          cache-from: type=gha
