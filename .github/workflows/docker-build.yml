---
name: Docker build

'on':
  pull_request:
  push:
    branches:
      - '**'
      - '!master'

jobs:

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      # Only one image is built, at whatever version upstream T-Pot pins
      # Elasticsearch to. Shipping a filebeat that does not match the
      # Elasticsearch it feeds is unsupported by Elastic, so the old matrix of
      # many versions has no reason to exist.
      - name: Resolve upstream Elasticsearch version
        id: upstream
        uses: ./.github/actions/upstream-es-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          load: true
          tags: quay.io/honeynet/filebeat:${{ steps.upstream.outputs.version }}
          build-args: |
            filebeat_version=${{ steps.upstream.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds but produces an image filebeat cannot run in is
      # worse than a build failure, because it publishes.
      - name: Smoke test the image
        env:
          IMAGE: quay.io/honeynet/filebeat:${{ steps.upstream.outputs.version }}
          EXPECTED: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          reported="$(docker run --rm "$IMAGE" version)"
          echo "$reported"

          if ! printf '%s' "$reported" | grep -q "$EXPECTED"; then
            echo "::error::Image reports '$reported', expected version $EXPECTED"
            exit 1
          fi

          # The role mounts configuration into these paths, and they must be
          # writable by the uid the Dockerfile switches to.
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test "$(id -u)" = 2000
            test -d /usr/share/filebeat/conf.d
            test -d /usr/share/filebeat/pki
            touch /usr/share/filebeat/conf.d/.probe
            touch /usr/share/filebeat/pki/.probe
          '
          echo "Image runs as uid 2000 with writable conf.d and pki."
